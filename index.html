<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Web - 9Router</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar collapsed">
      <div class="sidebar-section">
        <h3 class="sidebar-title">💬 Conversas</h3>
        <button id="novaConversaBtn" class="sidebar-btn" onclick="criarConversa()">+ Nova conversa</button>
        <ul id="listaConversas" class="sidebar-list"></ul>

        <div class="export-group">
          <button class="sidebar-btn" onclick="toggleExportMenu()">⬇ Exportar conversa</button>
          <div id="exportMenu" class="export-menu">
            <button onclick="exportarConversa('txt')">📄 TXT</button>
            <button onclick="exportarConversa('md')">📝 Markdown</button>
            <button onclick="exportarConversa('json')">🧾 JSON</button>
          </div>
        </div>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-title">📝 Tarefas</h3>
        <div class="todo-add">
          <input id="todoInput" type="text" placeholder="Adicionar tarefa..." maxlength="80">
          <button onclick="adicionarTodo()" title="Adicionar tarefa">➕</button>
        </div>
        <div class="todo-contador" id="todoContador"></div>
        <ul id="listaTodos" class="todo-list"></ul>
      </div>

      <div class="sidebar-section">
        <h3 class="sidebar-title">⚙️ Contexto</h3>
        <textarea id="contextoInput" class="contexto-textarea" placeholder="Instruções para o assistente (ex: 'Sempre responda em português')" rows="4"></textarea>
        <button class="sidebar-btn contexto-btn" onclick="salvarContexto()">Salvar contexto</button>
      </div>
    </aside>

    <div class="main">
      <div class="header">
        <button id="sidebarToggle" class="btn-new" onclick="toggleSidebar()" title="Abrir/fechar painel lateral">☰</button>
        <h1>Chat Web</h1>
        <select id="modelSelect" onchange="salvarModeloSelecionado()">
          <option value="">Carregando modelos...</option>
        </select>

        <button id="stopBtn" class="btn-new" onclick="pararResposta()" style="display:none">⏹ Parar</button>
        <button class="btn-new" onclick="novaConversa()">+ Nova</button>

        <div class="theme-picker">
          <button id="themeBtn" class="btn-new theme-btn" onclick="toggleThemeMenu()" title="Selecionar tema">☀️</button>
          <div id="themeMenu" class="theme-menu">
            <button data-theme="" onclick="selectTheme('')">☀️ Claro</button>
            <button data-theme="dark-blue" onclick="selectTheme('dark-blue')">🌙 Azul</button>
            <button data-theme="dark-black" onclick="selectTheme('dark-black')">🖤 Preto</button>
            <button data-theme="dark-gray" onclick="selectTheme('dark-gray')">🌫️ Cinza</button>
          </div>
        </div>
      </div>

      <div class="messages" id="messages">
        <div class="empty">Selecione um modelo e comece a conversar!</div>
      </div>

      <div class="input-area">
        <textarea id="input" rows="1" placeholder="Digite sua mensagem..." onkeydown="handleKey(event)"></textarea>
        <button id="sendBtn" onclick="enviarMensagem()" disabled>➤</button>
      </div>
    </div>
  </div>

  <script src="js/sidebar.js"></script>
  <script src="js/todos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
